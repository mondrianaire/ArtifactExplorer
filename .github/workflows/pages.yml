name: Deploy viewer to GitHub Pages

# Publishes only the built site: the root redirect, the viewer and the
# schema reference it links to. tools/, docs/ and the corpus sources stay
# in the repo and are not served.
# Needs Settings -> Pages -> Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/validate.py
      - run: python tools/build-graph.py
      - name: Assemble the site
        run: |
          mkdir -p _site/viewer
          cp index.html .nojekyll 01-SCHEMA.md LICENSE LICENSE-CONTENT _site/
          cp viewer/index.html viewer/data.json _site/viewer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
