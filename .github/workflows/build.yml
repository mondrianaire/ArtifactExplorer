name: Validate and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate corpus against the schemas
        run: python tools/validate.py
      - name: Build viewer/data.json (includes the source-coverage gate)
        run: python tools/build-graph.py
